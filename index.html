<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rojak Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
  --green:#0D2B1D;
  --gold:#D4A843;
  --cream:#F4EBD8;
  --black:#050807;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Inter;
  background:var(--black);
  color:var(--cream);
}

/* NAV SIMPLE */
.nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  padding:20px 40px;
  z-index:100;
  display:flex;
  justify-content:space-between;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);
}

.brand{
  font-family:"Bebas Neue";
  font-size:26px;
  letter-spacing:2px;
}

/* GALLERY FULLPAGE */
.gallery{
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

/* chaque slide */
.panel{
  height:100vh;
  scroll-snap-align:start;
  position:relative;
}

/* image */
.panel img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* overlay luxe */
.panel::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0.2),
    rgba(0,0,0,0.6)
  );
}

/* texte */
.caption{
  position:absolute;
  bottom:80px;
  left:60px;
  font-family:"Bebas Neue";
  font-size:60px;
  letter-spacing:3px;
  color:var(--cream);
}

/* effet smooth */
.gallery{
  scroll-behavior:smooth;
}

/* scrollbar clean */
.gallery::-webkit-scrollbar{
  display:none;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="brand">ROJAK</div>
</div>

<!-- GALLERY -->
<section class="gallery">

  <div class="panel">
    <img src="vue ensemble entree.png">
    <div class="caption">Arrival</div>
  </div>

  <div class="panel">
    <img src="salle.png">
    <div class="caption">Dining Experience</div>
  </div>

  <div class="panel">
    <img src="cuisine.png">
    <div class="caption">Open Kitchen</div>
  </div>

  <div class="panel">
    <img src="rooftop.png">
    <div class="caption">Rooftop</div>
  </div>

  <div class="panel">
    <img src="vue nuit.png">
    <div class="caption">Night Atmosphere</div>
  </div>

</section>

</body>
</html>
