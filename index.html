<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROJAK EXPERIENCE</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --green:#0D2B1D;
  --gold:#D4A843;
  --cream:#F4EBD8;
  --black:#050807;
}

body{
  font-family:Inter;
  background:var(--black);
  color:var(--cream);
  overflow-x:hidden;
}

/* NAV */
.nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  padding:20px 40px;
  z-index:100;
  display:flex;
  justify-content:space-between;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
}

.brand{
  font-family:"Bebas Neue";
  font-size:26px;
  letter-spacing:2px;
}

/* SECTION */
.panel{
  height:100vh;
  position:relative;
  overflow:hidden;
}

/* IMAGE */
.panel img{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.2);
}

/* OVERLAY */
.panel::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0.2),
    rgba(0,0,0,0.75)
  );
}

/* TEXT */
.caption{
  position:absolute;
  bottom:80px;
  left:60px;
  font-family:"Bebas Neue";
  font-size:60px;
  letter-spacing:3px;
  opacity:0;
  transform:translateY(80px);
}

</style>
</head>

<body>

<div class="nav">
  <div class="brand">ROJAK</div>
</div>

<section class="panel">
  <img src="vue ensemble entree.png">
  <div class="caption">Arrival</div>
</section>

<section class="panel">
  <img src="salle.png">
  <div class="caption">Dining Experience</div>
</section>

<section class="panel">
  <img src="cuisine.png">
  <div class="caption">Open Kitchen</div>
</section>

<section class="panel">
  <img src="rooftop.png">
  <div class="caption">Rooftop</div>
</section>

<section class="panel">
  <img src="vue nuit.png">
  <div class="caption">Night Atmosphere</div>
</section>

<script>

gsap.registerPlugin(ScrollTrigger);

// PARALLAX + ZOOM IMAGE
gsap.utils.toArray(".panel").forEach(panel => {

  const img = panel.querySelector("img");
  const text = panel.querySelector(".caption");

  // image zoom fluide
  gsap.to(img, {
    scale: 1,
    ease: "none",
    scrollTrigger: {
      trigger: panel,
      start: "top bottom",
      end: "bottom top",
      scrub: true
    }
  });

  // parallaxe vertical léger
  gsap.to(img, {
    y: "-10%",
    ease: "none",
    scrollTrigger: {
      trigger: panel,
      start: "top bottom",
      end: "bottom top",
      scrub: true
    }
  });

  // texte apparition
  gsap.to(text, {
    y: 0,
    opacity: 1,
    ease: "power2.out",
    scrollTrigger: {
      trigger: panel,
      start: "top 60%",
      toggleActions: "play none none reverse"
    }
  });

});

// SNAP ENTRE SECTIONS (APPLE EFFECT)
ScrollTrigger.create({
  snap: {
    snapTo: 1 / (document.querySelectorAll(".panel").length - 1),
    duration: 0.6,
    ease: "power1.inOut"
  }
});

</script>

</body>
</html>
