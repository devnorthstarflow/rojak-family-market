<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROJAK EXPERIENCE</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Inter;
  background:#050807;
  color:#F4EBD8;
  overflow-x:hidden;
}

/* NAV */
.nav{
  position:fixed;
  top:0;
  left:0;
  right:0;
  padding:20px;
  z-index:100;
  background:rgba(0,0,0,0.4);
}

.brand{
  font-family:"Bebas Neue";
  font-size:24px;
}

/* SECTION */
.panel{
  height:100vh;
  position:relative;
  overflow:hidden;
}

/* IMAGE */
.panel img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* TEXT */
.caption{
  position:absolute;
  bottom:60px;
  left:40px;
  font-family:"Bebas Neue";
  font-size:48px;
  opacity:0;
}
</style>
</head>

<body>

<div class="nav">
  <div class="brand">ROJAK</div>
</div>

<section class="panel">
  <img src="https://picsum.photos/1600/900?1">
  <div class="caption">Arrival</div>
</section>

<section class="panel">
  <img src="https://picsum.photos/1600/900?2">
  <div class="caption">Dining</div>
</section>

<section class="panel">
  <img src="https://picsum.photos/1600/900?3">
  <div class="caption">Kitchen</div>
</section>

<section class="panel">
  <img src="https://picsum.photos/1600/900?4">
  <div class="caption">Rooftop</div>
</section>

<script>
window.addEventListener("load", () => {

  gsap.registerPlugin(ScrollTrigger);

  document.querySelectorAll(".panel").forEach(panel => {

    const img = panel.querySelector("img");
    const text = panel.querySelector(".caption");

    gsap.fromTo(img,
      { scale: 1.2 },
      {
        scale: 1,
        scrollTrigger: {
          trigger: panel,
          start: "top bottom",
          end: "bottom top",
          scrub: true
        }
      }
    );

    gsap.fromTo(text,
      { y: 80, opacity: 0 },
      {
        y: 0,
        opacity: 1,
        scrollTrigger: {
          trigger: panel,
          start: "top 60%",
          end: "top 40%",
          scrub: true
        }
      }
    );

  });

});
</script>

</body>
</html>
